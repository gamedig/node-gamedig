
name: Node

on:
  push:
    branches: [ "master" ]
    paths:
      - "**.js" # Any JS file
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/node.yml" # This action
  pull_request:
    branches: [ "master" ]
    paths:
      - "**.js" # Any JS file
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/node.yml" # This action

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.20.0, 18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v3
    - name: Use Node ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present

  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The built-in node:test runner's automatic file discovery is reliable
        # on Node 18+; older releases are still covered by the build job above.
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v3
    - name: Use Node ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm test
